services:
  opencode-web:
    image: opencode-serve:latest
    container_name: opencode-web
    restart: unless-stopped
    ports:
      - "4096:4096"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./volumes/cron-state:/workspace/cron_jobs/state
      - ./volumes/cron-logs:/workspace/cron_jobs/logs
      - ./volumes/vt-memory:/workspace/.vt-memory
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '0.8'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s