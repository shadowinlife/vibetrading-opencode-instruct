# nginx configuration for HTML report hosting
# Server: 120.26.181.156 (Alibaba Cloud Linux 3)
# Deploy: Copy to /etc/nginx/conf.d/reports.conf on the remote server
#
# Serves static HTML reports from /opt/reports/ at http://120.26.181.156/reports/
# Reports are deployed via SCP from scripts/reports/deploy_report.py

server {
    listen 80;
    server_name 120.26.181.156;

    # HTML reports
    location /reports/ {
        alias /opt/reports/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;

        # Cache static HTML for 1 hour, assets for 1 day
        location ~* \.html$ {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff;
        }
    }

    # Health check endpoint
    location /reports/health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
